dependencies:
  tools:
    - type: "mcp"
      value: "anima"
      description: "Agent Grid MCP server — build, host, publish, and edit web apps from prompts, websites, Figma designs, or your own code"
      transport: "streamable_http"
      url: "https://api.agentgrid.io/v1/mcp"

interface:
  display_name: "Agent Grid"
  short_description: "Build, host, and publish web apps from prompts, websites, and Figma"
  icon_small: "./assets/anima-icon.svg"
  brand_color: "#FF6250"
  default_prompt: "Use $anima to create a web app from my prompt, website, Figma design, or local code."

policy:
  allow_implicit_invocation: true
