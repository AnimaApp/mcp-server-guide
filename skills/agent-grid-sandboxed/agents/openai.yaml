dependencies:
  tools:
    - type: "mcp"
      value: "anima"
      description: "Agent Grid MCP server for sandboxed artifact work"
      transport: "streamable_http"
      url: "https://api.agentgrid.io/v1/mcp"

interface:
  display_name: "Agent Grid Sandboxed"
  short_description: "Use local text files with Agent Grid over MCP"
  icon_small: "./assets/agent-grid-logo.svg"
  brand_color: "#FF6250"
  default_prompt: "Use $agent-grid-sandboxed to create and edit an Agent Grid artifact with MCP text-file tools."

policy:
  allow_implicit_invocation: true
